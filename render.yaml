# render.yaml — place this in the ROOT of your manna-api repo.
# Render auto-detects this file and configures the service from it,
# so you don't have to click through every setting in their dashboard.

services:
  - type: web
    name: manna-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: |
      npm install
      npm run build
      npm run seed || echo "Seeding failed but continuing..."  # Runs after build
      npm run send-daily-menu || echo "Seeding failed but continuing..."  # Runs after build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Manna Office Meals <noreply@mannaworkmeals.com>"
      - key: TERMII_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOW_DEBUG_LOGIN_LINK
        value: "false"
      - key: UPLOADS_DIR
        value: /var/data/uploads

disk:
  name: manna-uploads
  mountPath: /var/data
  sizeGB: 1